# Tests every push and pull request. On main (and on v* tags) it then builds the
# container image and pushes it to ghcr.io/structuralpython/posterboard, tagged
# latest (main), the commit SHA, and the version for a tag.

name: Test and build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/structuralpython/posterboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name pb -p 8080:8080 \
            -e DJANGO_SECRET_KEY=ci -e POSTERBOARD_URL=http://posterboard.localhost:8080 \
            -e TINYAUTH_APPURL=http://auth.posterboard.localhost:8080 \
            -e 'TINYAUTH_AUTH_USERS=ci:$2a$10$3jaaaJTyZqRg.CGOhVzaz.GbT7Ld6cBYna0MvS9kK0N58HKSo4lna' \
            -e TINYAUTH_AUTH_SECURECOOKIE=false \
            "${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD)"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/healthz
          # Caddy answers /healthz itself; wait for tinyauth and Django to start.
          for i in $(seq 1 30); do curl -sf -o /dev/null -H 'Host: posterboard.localhost' http://127.0.0.1:8080/privacy/ && break; sleep 2; done
          # Every app request must go through tinyauth.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: posterboard.localhost' http://127.0.0.1:8080/)" = 401
          # The privacy policy and its stylesheet are public.
          curl -sf -H 'Host: posterboard.localhost' http://127.0.0.1:8080/privacy/ | grep -q 'Privacy policy' || { docker logs pb 2>&1 | tail -40; exit 1; }
          css=$(curl -s -H 'Host: posterboard.localhost' http://127.0.0.1:8080/privacy/ | grep -o '/static/[^"]*\.css')
          curl -sf -o /dev/null -H 'Host: posterboard.localhost' "http://127.0.0.1:8080$css"
          docker logs pb 2>&1 | tail -20
